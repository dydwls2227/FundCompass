plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fundcompass'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
    }
    // -Dbatch.size=N 을 테스트 JVM으로 전달한다. 없으면 Gradle 데몬에만 붙어 테스트에서 안 보인다
    ['batch.size'].each { key ->
        if (System.getProperty(key) != null) {
            systemProperty key, System.getProperty(key)
        }
    }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'// flyway
    implementation 'org.apache.pdfbox:pdfbox:3.0.7' // pdf
    // hwp 바이너리(CFBF). hwpx는 ZIP+XML이라 JDK만으로 읽으므로 hwpxlib을 쓰지 않는다
    // (hwpxlib 1.0.5에는 텍스트 추출기가 없고 파일 경로만 받는다)
    implementation 'kr.dogfoot:hwplib:1.1.9'
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0')
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai' // gemini
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql' // db
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}
