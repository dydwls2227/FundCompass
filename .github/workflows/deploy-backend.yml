name: Deploy Backend

# main 에 백엔드 코드가 바뀌면 배포한다.
# 프론트엔드는 Vercel의 GitHub 연동이 알아서 배포하므로 여기서 다루지 않는다.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:        # 수동 실행도 가능하게

concurrency:
  group: deploy-backend
  cancel-in-progress: false   # 배포 중 취소하면 서버가 어중간한 상태가 된다

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      # 테스트는 DB와 외부 API가 필요해 CI에서 돌리지 않는다.
      # 대부분이 수동 검증용(*ManualTest)이고 LLM 호출·쿼터를 쓴다.
      - name: Build JAR
        run: ./gradlew bootJar -x test --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: build/libs/*.jar
          target: /opt/fundcompass/incoming
          strip_components: 2

      # 무중단은 아니다. 프리티어 1GB에서 두 프로세스를 동시에 띄울 수 없다.
      # 재시작에 20~30초 걸리며, 심사 데모 규모에서는 감수할 만하다
      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            NEW=$(ls -t /opt/fundcompass/incoming/*.jar | head -1)
            # 실패해도 되돌릴 수 있게 직전 버전을 남긴다
            [ -f /opt/fundcompass/app.jar ] && cp /opt/fundcompass/app.jar /opt/fundcompass/app.jar.prev
            mv "$NEW" /opt/fundcompass/app.jar
            sudo systemctl restart fundcompass
            sleep 25
            # 살아났는지 확인한다. 죽었으면 워크플로를 실패로 남긴다
            curl -fsS -X POST http://localhost:8080/api/matches \
              -H 'Content-Type: application/json' -d '{}' -o /dev/null
            echo "배포 확인 완료"
