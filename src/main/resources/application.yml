spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fundcompass

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fundcompass}
    username: ${DB_USERNAME:fundcompass}
    password: ${DB_PASSWORD:localdev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash}
          temperature: 0.0
          max-output-tokens: 8192
          thinking-budget: 0

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info
    com.fundcompass.program.service.BizinfoProgramMapper: debug
    org.apache.pdfbox: error
    org.apache.fontbox: error

bizinfo:
  api:
    base-url:
      https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do
    key: ${BIZINFO_API_KEY:}


fundcompass:
  # 프론트엔드 오리진. 배포 시 Vercel 도메인을 콤마로 추가한다
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # F5 설명 생성 — 공고 추출용 키(spring.ai.google.genai)와 의도적으로 분리한다.
  # 사용자의 사업자 정보를 보내는 경로이므로 유료 키를 쓴다.
  # 비워두면 설명 없이 판정 결과만 반환한다 (서비스는 정상 동작).
  explanation:
    api-key: ${GEMINI_EXPLAIN_API_KEY:}
    model: ${GEMINI_EXPLAIN_MODEL:gemini-2.5-flash}
    max-output-tokens: 1024

  scheduler:
    program-sync:
      enabled: ${PROGRAM_SYNC_ENABLED:false} # 배포에서 환경변수로만
      cron: "0 30 4 * * *"