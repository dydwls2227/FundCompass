services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: fundcompass-postgres
    environment:
      POSTGRES_DB: fundcompass
      POSTGRES_USER: fundcompass
      POSTGRES_PASSWORD: localdev
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundcompass -d fundcompass"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: